services:
  image-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Env vars use __ as path separator with exact camelCase key names
      # matching the config.json structure, e.g. imageMetadata__parentPath.
      log__level: info
      imageMetadata__storage: db
      # imageMetadata__parentPath: /metadata
      db__host: postgres
      db__port: 5432
      db__database: image_service
      db__username: image-service
      db__password: image-service
      # Local S3 — MinIO stands in for the real bucket. `endpointUrl` switches the
      # SDK over and turns on path-style addressing.
      s3__endpointUrl: http://minio:9000
      s3__bucketName: image-service-local
      s3__accessKeyId: minioadmin
      s3__secretAccessKey: minioadmin
      s3__region: us-east-1
      # No keypairId means CloudFront URLs come back unsigned, so they point straight
      # at MinIO's anonymous-download endpoint — which is what lets the transcode
      # endpoint fetch the source back. This is the in-network address because the
      # service itself follows these URLs; from the host, swap `minio` for
      # `localhost` in any URL the API returns.
      cloudfront__url: http://minio:9000/image-service-local
    volumes:
      #- ./metadata:/metadata
      - ../../configs/image-service:/sandbox
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # S3 stand-in for local testing. Console on :9001, API on :9000.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and opens it for anonymous GET, so the unsigned "CloudFront"
  # URLs the service hands out are directly fetchable. Runs once and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/image-service-local &&
      mc anonymous set download local/image-service-local
      "

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: image_service
      POSTGRES_USER: image-service
      POSTGRES_PASSWORD: image-service
    ports: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image-service -d image_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
